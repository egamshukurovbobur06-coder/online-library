<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Orqa fon - yumshoq krem yashil -->
    <rect width="512" height="512" rx="80" fill="#eef5ee"/>
    
    <!-- Ichki oq fon (yumaloq kvadrat) -->
    <rect x="40" y="40" width="432" height="432" rx="60" fill="#ffffff" stroke="#d4e6d4" stroke-width="6"/>
    
    <!-- Chap kitob (to'q jigarrang) -->
    <rect x="100" y="160" width="90" height="220" rx="8" fill="#5d3a1a" stroke="#3d2b1f" stroke-width="5"/>
    <line x1="100" y1="200" x2="190" y2="200" stroke="#4a2f18" stroke-width="3" opacity="0.5"/>
    <line x1="100" y1="340" x2="190" y2="340" stroke="#4a2f18" stroke-width="3" opacity="0.5"/>
    
    <!-- O'rta kitob (iliq jigarrang) - eng katta -->
    <rect x="190" y="120" width="132" height="280" rx="8" fill="#7a4e2d" stroke="#3d2b1f" stroke-width="5"/>
    <line x1="190" y1="170" x2="322" y2="170" stroke="#5d3a1a" stroke-width="3" opacity="0.5"/>
    <line x1="190" y1="350" x2="322" y2="350" stroke="#5d3a1a" stroke-width="3" opacity="0.5"/>
    <!-- Kitob nomi chizig'i -->
    <line x1="240" y1="240" x2="272" y2="240" stroke="#e8d5c0" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="240" y1="260" x2="272" y2="260" stroke="#e8d5c0" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- O'ng kitob (to'q jigarrang) -->
    <rect x="322" y="160" width="90" height="220" rx="8" fill="#5d3a1a" stroke="#3d2b1f" stroke-width="5"/>
    <line x1="322" y1="200" x2="412" y2="200" stroke="#4a2f18" stroke-width="3" opacity="0.5"/>
    <line x1="322" y1="340" x2="412" y2="340" stroke="#4a2f18" stroke-width="3" opacity="0.5"/>
</svg>