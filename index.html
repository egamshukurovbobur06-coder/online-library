<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Kutubxona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Kirish qismi -->
    <div id="authSection">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-icon">📖</div>
                <h1>Online Kutubxona</h1>
                <p class="auth-desc">Kitoblar dunyosiga xush kelibsiz</p>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Kirish</button>
                    <button class="auth-tab" data-tab="register">Ro'yxatdan o'tish</button>
                </div>

                <!-- Kirish paneli -->
                <div id="loginPanel" class="auth-panel active">
                    <input type="text" id="loginUsername" class="auth-input" placeholder="Login">
                    <input type="password" id="loginPassword" class="auth-input" placeholder="Parol">
                    <button id="loginBtn" class="auth-btn">Kirish</button>
                </div>

                <!-- Ro'yxatdan o'tish paneli -->
                <div id="registerPanel" class="auth-panel">
                    <input type="text" id="regName" class="auth-input" placeholder="Ismingiz">
                    <input type="text" id="regUsername" class="auth-input" placeholder="Login">
                    <input type="password" id="regPassword" class="auth-input" placeholder="Parol">
                    <p style="color: #64748b; font-size: 11px; margin-top: -10px; margin-bottom: 14px; padding-left: 4px;">
                        🔒 Kamida 8 ta belgi, 1 ta katta harf va 1 ta raqam
                    </p>
                    <input type="password" id="regPasswordConfirm" class="auth-input" placeholder="Parolni takrorlang">
                    <button id="registerBtn" class="auth-btn">Ro'yxatdan o'tish</button>
                </div>

                <div id="authMessage" class="auth-message"></div>
            </div>
        </div>
    </div>

    <!-- Asosiy interfeys -->
    <div id="mainApp" style="display: none;">
        <!-- Chap yon panel -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-avatar" id="sidebarAvatar"></div>
                <h3 id="sidebarName"></h3>
                <p id="sidebarEmail"></p>
            </div>

            <nav class="sidebar-nav">
                <button class="sidebar-link active" data-panel="library">
                    <span class="sidebar-link-icon">📚</span>
                    <span>Kutubxona</span>
                </button>
                <button class="sidebar-link" data-panel="profile">
                    <span class="sidebar-link-icon">👤</span>
                    <span>Profil</span>
                </button>
                <button class="sidebar-link" data-panel="stats">
                    <span class="sidebar-link-icon">📊</span>
                    <span>Statistika</span>
                </button>
                <button class="sidebar-link" data-panel="themes">
                    <span class="sidebar-link-icon">🎨</span>
                    <span>Mavzular</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button id="sidebarLogout" class="sidebar-logout">
                    <span>🚪</span>
                    <span>Chiqish</span>
                </button>
            </div>
        </aside>

        <!-- Asosiy kontent -->
        <div class="main-wrapper">
            <header class="app-header">
                <button id="menuToggle" class="menu-toggle">☰</button>
                <div class="header-search">
                    <input type="text" id="searchInput" placeholder="Kitob nomi yoki yozuvchi bo'yicha qidirish...">
                    <span class="search-icon">🔍</span>
                </div>
            </header>

            <main class="app-main">
                <!-- Kutubxona paneli -->
                <div id="libraryPanel" class="panel active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📚</div>
                            <div class="stat-value" id="statTotal">0</div>
                            <div class="stat-label">Jami kitoblar</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-value" id="statRead">0</div>
                            <div class="stat-label">O'qilgan</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📖</div>
                            <div class="stat-value" id="statReading">0</div>
                            <div class="stat-label">O'qiyapman</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📌</div>
                            <div class="stat-value" id="statUnread">0</div>
                            <div class="stat-label">O'qilmagan</div>
                        </div>
                    </div>

                    <div class="shelves-section">
                        <div class="shelves-header">
                            <h3>Kitob javonlari</h3>
                            <button id="addShelfBtn" class="add-shelf-btn">+ Yangi javon</button>
                        </div>
                        <div id="shelvesContainer" class="shelves-container"></div>
                    </div>
                </div>

                <!-- Profil paneli -->
                <div id="profilePanel" class="panel">
                    <div class="profile-card">
                        <div class="profile-avatar" id="profileAvatar"></div>
                        <h2 id="profileName"></h2>
                        <p id="profileEmail"></p>
                        <div class="profile-stats">
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="profileBooks">0</span>
                                <span class="profile-stat-label">Kitoblar</span>
                            </div>
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="profileShelves">0</span>
                                <span class="profile-stat-label">Javonlar</span>
                            </div>
                            <div class="profile-stat">
                                <span class="profile-stat-value" id="profileRead">0</span>
                                <span class="profile-stat-label">O'qilgan</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Statistika paneli -->
                <div id="statsPanel" class="panel">
                    <h3 class="panel-title">📊 Barcha foydalanuvchilar</h3>
                    <div id="globalStatsList" class="global-stats-list"></div>
                </div>

                <!-- Mavzular paneli -->
                <div id="themesPanel" class="panel">
                    <h3 class="panel-title">🎨 Mavzu tanlash</h3>
                    <div class="themes-grid" id="themesGrid"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Kitob qo'shish/tahrirlash modali -->
    <div id="bookModal" class="modal-custom">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
